[package]
name = "low-poly-car-builder"
version = "0.1.0"
description = "Low poly car and parts builder for Roblox"
authors = ["Helium0o"]
edition = "2021"

[lib]
name = "low_poly_car_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
