name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y assimp-utils
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - name: Collect the exe and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "src-tauri/target/release/low-poly-car-builder.exe" "out/LowPolyCarBuilder.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "out/"
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: LowPolyCarBuilder-windows
          path: out/*.exe
          if-no-files-found: error
